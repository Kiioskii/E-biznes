services:
  backend:
    build:
      context: ./backend
    container_name: shop-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: shop-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - backend
